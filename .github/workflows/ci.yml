name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  image:
    name: Build & push image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    # Two merges close together each start a run, and `latest` is whichever
    # finishes last — not whichever is newest. That has already published an
    # older build over a newer one. Serialising on the ref and cancelling the
    # superseded run means the newest commit is the one that publishes.
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TG_BOT_API_URL=${{ vars.NEXT_PUBLIC_TG_BOT_API_URL }}
            NEXT_PUBLIC_TG_BOT_USERNAME=${{ vars.NEXT_PUBLIC_TG_BOT_USERNAME }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the immutable reference
        run: |
          {
            echo "### Image published"
            echo
            echo "Deploy this exact build by digest — it names one image forever,"
            echo "where \`latest\` names whichever build most recently claimed it:"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Commit \`${{ github.sha }}\` · also tagged \`latest\` and \`sha-$(echo ${{ github.sha }} | cut -c1-7)\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # No deploy step: the image is published to GHCR
      # (ghcr.io/${{ github.repository }}:latest, :sha-<short> and the digest
      # printed in the run summary). Pull it and update the compose stack on the
      # server manually — prefer the digest, which cannot be reassigned.
